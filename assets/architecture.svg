<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#151b2f"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b8cff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5c8a"/><stop offset="1" stop-color="#ff8a5c"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#8491b5"/></marker>
  <style>
    .title{font:700 34px Inter,Arial,sans-serif;fill:#fff}.sub{font:400 17px Inter,Arial,sans-serif;fill:#aeb9d6}
    .h{font:700 18px Inter,Arial,sans-serif;fill:#fff}.p{font:400 14px Inter,Arial,sans-serif;fill:#aeb9d6}
    .tag{font:700 12px Inter,Arial,sans-serif;fill:#dce4ff;letter-spacing:1.2px}
  </style>
</defs>
<rect width="1400" height="820" rx="30" fill="url(#bg)"/>
<text x="70" y="70" class="title">Movie Recommender System · Architecture</text>
<text x="70" y="101" class="sub">From movie metadata to ranked recommendations — then enriched with TMDB posters.</text>

<rect x="55" y="145" width="1290" height="270" rx="24" fill="#11182a" stroke="#263352"/>
<text x="85" y="180" class="tag">01 · MODEL BUILDING</text>

<g filter="url(#shadow)">
<rect x="85" y="215" width="190" height="145" rx="18" fill="#17223a" stroke="#314263"/>
<text x="105" y="250" class="h">🎞️ TMDB 5000</text><text x="105" y="278" class="p">Movies + credits</text><text x="105" y="312" class="p">4,809 merged rows</text><text x="105" y="337" class="p">Overview · genres</text>
</g>
<line x1="280" y1="287" x2="320" y2="287" stroke="#8491b5" stroke-width="3" marker-end="url(#arrow)"/>

<g filter="url(#shadow)">
<rect x="330" y="215" width="205" height="145" rx="18" fill="#17223a" stroke="#314263"/>
<text x="350" y="250" class="h">🧩 Feature Builder</text><text x="350" y="278" class="p">Keywords · cast</text><text x="350" y="302" class="p">Director · tags</text><text x="350" y="336" class="p">Clean + normalize</text>
</g>
<line x1="540" y1="287" x2="580" y2="287" stroke="#8491b5" stroke-width="3" marker-end="url(#arrow)"/>

<g filter="url(#shadow)">
<rect x="590" y="215" width="205" height="145" rx="18" fill="url(#blue)"/>
<text x="610" y="250" class="h">🔤 NLP</text><text x="610" y="278" class="p">Porter stemming</text><text x="610" y="302" class="p">CountVectorizer</text><text x="610" y="336" class="p">5,000 features</text>
</g>
<line x1="800" y1="287" x2="840" y2="287" stroke="#8491b5" stroke-width="3" marker-end="url(#arrow)"/>

<g filter="url(#shadow)">
<rect x="850" y="215" width="205" height="145" rx="18" fill="#17223a" stroke="#314263"/>
<text x="870" y="250" class="h">📐 Similarity</text><text x="870" y="278" class="p">Cosine similarity</text><text x="870" y="302" class="p">4,806 × 4,806</text><text x="870" y="336" class="p">Precomputed matrix</text>
</g>
<line x1="1060" y1="287" x2="1100" y2="287" stroke="#8491b5" stroke-width="3" marker-end="url(#arrow)"/>

<g filter="url(#shadow)">
<rect x="1110" y="215" width="205" height="145" rx="18" fill="#17223a" stroke="#314263"/>
<text x="1130" y="250" class="h">💾 Artifacts</text><text x="1130" y="280" class="p">movie_dict.pkl</text><text x="1130" y="307" class="p">similarity_1.pkl</text><text x="1130" y="337" class="p">Ready for serving</text>
</g>

<rect x="55" y="455" width="1290" height="300" rx="24" fill="#11182a" stroke="#263352"/>
<text x="85" y="490" class="tag">02 · APPLICATION / INFERENCE</text>

<g filter="url(#shadow)">
<rect x="90" y="535" width="200" height="145" rx="18" fill="#17223a" stroke="#314263"/>
<text x="110" y="570" class="h">👤 User</text><text x="110" y="600" class="p">Selects a movie</text><text x="110" y="630" class="p">from Streamlit</text>
</g>
<line x1="295" y1="607" x2="335" y2="607" stroke="#8491b5" stroke-width="3" marker-end="url(#arrow)"/>

<g filter="url(#shadow)">
<rect x="345" y="535" width="220" height="145" rx="18" fill="url(#pink)"/>
<text x="365" y="570" class="h">🎯 Rank Matches</text><text x="365" y="600" class="p">Read similarity row</text><text x="365" y="628" class="p">Sort descending</text><text x="365" y="656" class="p">Return Top 5</text>
</g>
<line x1="570" y1="607" x2="610" y2="607" stroke="#8491b5" stroke-width="3" marker-end="url(#arrow)"/>

<g filter="url(#shadow)">
<rect x="620" y="535" width="220" height="145" rx="18" fill="#17223a" stroke="#314263"/>
<text x="640" y="570" class="h">🌐 TMDB API</text><text x="640" y="600" class="p">Movie ID → poster</text><text x="640" y="628" class="p">External enrichment</text><text x="640" y="656" class="p">API key via secrets</text>
</g>
<line x1="845" y1="607" x2="885" y2="607" stroke="#8491b5" stroke-width="3" marker-end="url(#arrow)"/>

<g filter="url(#shadow)">
<rect x="895" y="525" width="410" height="165" rx="20" fill="#0e1424" stroke="#5b8cff" stroke-width="2"/>
<text x="925" y="563" class="h">🎬 Streamlit · Movie Recommender System</text>
<text x="925" y="595" class="p">Movie 1    Movie 2    Movie 3    Movie 4    Movie 5</text>
<rect x="925" y="620" width="60" height="48" rx="7" fill="#293656"/><rect x="995" y="620" width="60" height="48" rx="7" fill="#293656"/><rect x="1065" y="620" width="60" height="48" rx="7" fill="#293656"/><rect x="1135" y="620" width="60" height="48" rx="7" fill="#293656"/><rect x="1205" y="620" width="60" height="48" rx="7" fill="#293656"/>
</g>

<text x="70" y="792" class="sub">Content-based filtering · CountVectorizer · Cosine similarity · Streamlit · TMDB</text>
</svg>